<!doctype html><html><head><meta charset="utf-8"><title>Guided</title><link rel="stylesheet" href="popup.css"></head><body><h1>Guided</h1><button id="record">Start recording</button><button id="play">Play saved workflow</button><button id="export">Export saved workflow</button><section><h2>Workflow</h2><input id="name" placeholder="Workflow name"><textarea id="description" placeholder="Description"></textarea><textarea id="editor" spellcheck="false" placeholder="Workflow JSON"></textarea><button id="save">Save edits</button><input id="file" type="file" accept="application/json"><button id="loadFile">Import JSON file</button></section><section><h2>Remote storage</h2><select id="provider"><option value="local">Local browser storage</option><option value="api">Trusted API gateway</option><option value="s3">Amazon S3 via gateway</option><option value="backblaze">Backblaze B2 via gateway</option><option value="azure">Azure Blob via gateway</option></select><input id="endpoint" type="url" placeholder="https://your-gateway.example/api/workflows"><input id="bucket" placeholder="Bucket (optional)"><input id="container" placeholder="Container (optional)"><input id="prefix" placeholder="Object prefix (optional)"><button id="saveConfig">Save storage settings</button><input id="url" type="url" placeholder="Workflow JSON URL"><button id="load">Load remote workflow</button><button id="saveRemote">Save workflow remotely</button></section><p id="status" role="status" aria-live="polite"></p><script src="popup.js"></script></body></html>
